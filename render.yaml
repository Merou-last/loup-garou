services:
  - type: web
    name: loup-garou-bot
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DISABLE_AUDIO
        value: "1"
