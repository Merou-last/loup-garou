services:
  - type: web
    name: loup-garou-bot
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DISABLE_AUDIO
        value: "1"
      - key: SITE_ORIGINS
        value: "*"            # بعد اكتمال الإعداد ضع رابط مدونتك مثل https://yourblog.blogspot.com
      - key: SITE_URL
        sync: false
      - key: DISCORD_INVITE
        sync: false
